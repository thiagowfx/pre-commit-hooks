# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
#
# See https://prek.j178.dev for more information
# Migrated from pre-commit to prek: https://prek.j178.dev/benchmark/
#
# Install prek itself:
#   $ cargo install prek
#     OR
#   $ brew install prek
#
# Update all prek hooks to latest version:
#   $ prek update --freeze
#
# Install all default prek hooks locally:
#   $ prek install
#
# Apply a given prek hook to all files:
#   $ prek run --all-files <id>
#
# Apply all prek hooks to all files:
#   $ prek run --all-files
ci:
  autoupdate_schedule: monthly
  skip:
    # missing deps: just
    - just-format
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/google/keep-sorted
    rev: 339d935575ef7d92f2c9b4df9ce4b724d73c9201  # frozen: v0.9.1
    hooks:
      - id: keep-sorted
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/thiagowfx/pre-commit-hooks/
    rev: cbd85e45246586c8869439c8b7bcc38073204bd9  # frozen: v0.0.23
    hooks:
      - id: check-bash-shebang
        types:
          - shell
      - id: just-format
  - repo: https://github.com/zimbatm/mdsh.git
    rev: 4b8fb1e7b52a65d6ea875ede3272ac3571f5d015  # frozen: v0.9.2
    hooks:
      - id: mdsh
